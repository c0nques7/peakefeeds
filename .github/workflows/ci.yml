name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Throwaway database for the integration tests (same image as docker-compose.yml)
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: peakeuser
          POSTGRES_PASSWORD: peakepassword
          POSTGRES_DB: peakefeeds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peakeuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://peakeuser:peakepassword@localhost:5432/peakefeeds_test
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-not-a-secret
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Check migrations match the schema
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
